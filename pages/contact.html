<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我 | wyj484的Blog</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* ===== 联系页专属样式（复用 style.css 的变量与主题） ===== */
        .contact-header {
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 1px dashed rgba(0, 243, 255, 0.25);
        }

        .contact-header h1 {
            font-size: 1.8rem;
            line-height: 1.4;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .contact-header h1::before {
            content: "# ";
            color: var(--accent-purple);
        }

        .contact-header p {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        /* 联系方式卡片 */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 22px 25px;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .contact-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-cyan);
            box-shadow: 0 5px 20px rgba(0, 243, 255, 0.12);
        }

        .contact-icon {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            border-radius: 50%;
            border: 1px solid rgba(0, 243, 255, 0.35);
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            overflow: hidden;
        }

        .contact-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-info .label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .contact-info .value {
            font-size: 1.05rem;
            color: var(--text-main);
            word-break: break-all;
        }

        .contact-info .value:hover {
            color: var(--accent-cyan);
        }

        .contact-info .value::before {
            content: "> ";
            color: var(--accent-purple);
        }

        /* 复制按钮 */
        .copy-btn {
            flex-shrink: 0;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-dim);
            font-family: inherit;
            font-size: 0.78rem;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }

        .copy-btn.copied {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        /* 返回链接 */
        .back-link {
            display: inline-block;
            margin-top: 50px;
            font-size: 0.9rem;
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 4px;
        }

        .back-link:hover {
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
        }

        @media (max-width: 600px) {
            .contact-header h1 { font-size: 1.4rem; }
            .contact-card { flex-wrap: wrap; }
            .copy-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../index.html" class="logo">> wyj484的Blog</a>
            <nav>
                <a href="../index.html">Home</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </header>

        <main>
            <div class="contact-header">
                <h1>联系我</h1>
                <p>// 想聊聊技术、生活，或者只是打个招呼？欢迎通过以下方式找到我。</p>
            </div>

            <div class="contact-list">
                <div class="contact-card">
                    <div class="contact-icon"><img src="../image/Telegram.png" alt="Telegram"></div>
                    <div class="contact-info">
                        <span class="label">TELEGRAM</span>
                        <a class="value" href="https://t.me/wyj484" target="_blank" rel="noopener">@wyj484</a>
                    </div>
                    <button class="copy-btn" data-copy="@wyj484">[ 复制 ]</button>
                </div>

                <div class="contact-card">
                    <div class="contact-icon"><img src="../image/Outlook.png" alt="Outlook"></div>
                    <div class="contact-info">
                        <span class="label">EMAIL</span>
                        <a class="value" href="mailto:jcfk123@outlook.com">jcfk123@outlook.com</a>
                    </div>
                    <button class="copy-btn" data-copy="jcfk123@outlook.com">[ 复制 ]</button>
                </div>

                <div class="contact-card">
                    <div class="contact-icon"><img src="../image/Tencent_QQ-Logo.png" alt="QQ"></div>
                    <div class="contact-info">
                        <span class="label">QQ</span>
                        <a class="value" href="https://wpa.qq.com/msgrd?v=3&uin=641668016&site=qq&menu=yes" target="_blank" rel="noopener">641668016</a>
                    </div>
                    <button class="copy-btn" data-copy="641668016">[ 复制 ]</button>
                </div>
            </div>

            <a href="../index.html" class="back-link">&lt; 返回首页</a>
        </main>

        <footer>
            <p>&copy; 2026 wyj484的Blog | Powered by Cloudflare Workers and Github Copilot(DeepSeek V4.1 Flash模型驱动)</p>
        </footer>
    </div>

    <script>
        // 复制到剪贴板
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const text = btn.dataset.copy;
                try {
                    await navigator.clipboard.writeText(text);
                } catch (e) {
                    // 兼容旧浏览器
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                const original = btn.textContent;
                btn.textContent = '[ 已复制 ]';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 1500);
            });
        });
    </script>
</body>
</html>
